# Render Blueprint — Agent as a Docker Background Worker.
# Secrets use sync: false, so Render prompts for them instead of storing
# them in this file.
services:
  - type: worker
    name: agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
